[package]
name = "elecrypto-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Elecrypto Contributors"]
description = "Core cryptographic library for Elecrypto - cross-platform crypto for all languages"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elecrypto/elecrypto"
homepage = "https://elecrypto.org"
keywords = ["cryptography", "encryption", "security", "ffi"]
categories = ["cryptography", "api-bindings"]

[lib]
name = "elecrypto_core"
crate-type = ["cdylib", "rlib", "staticlib"]

[dependencies]
# Symmetric encryption
aes-gcm = "0.10"
chacha20poly1305 = "0.10"

# Hash functions
sha2 = "0.10"
sha3 = "0.10"
blake3 = "1.5"

# Key derivation
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac", "sha2"] }
argon2 = "0.5"
hkdf = "0.12"

# Asymmetric crypto
rsa = "0.9"
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
p384 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = "2.1"

# Post-Quantum Cryptography (NIST standards)
pqc_kyber = "0.7"  # ML-KEM (Kyber) - Key Encapsulation Mechanism
pqcrypto-dilithium = "0.5"  # ML-DSA (Dilithium) - Digital Signature
pqcrypto-falcon = "0.3"  # FN-DSA (Falcon) - Digital Signature
pqcrypto-sphincsplus = "0.6"  # SLH-DSA (SPHINCS+) - Stateless Hash-Based Signature
pqcrypto-traits = "0.3"  # Common traits for PQC algorithms

# Random number generation
rand = "0.8"
getrandom = "0.2"

# DRBG (Deterministic Random Bit Generators)
hmac = "0.12"
aes = "0.8"

# Utilities
zeroize = { version = "1.7", features = ["derive"] }
subtle = "2.5"
thiserror = "1.0"

[dev-dependencies]
hex = "0.4"
criterion = "0.5"

[build-dependencies]
cbindgen = "0.26"

[features]
default = ["std"]
std = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
