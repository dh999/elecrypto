# cbindgen configuration for generating C header files

language = "C"
header = """
/* Elecrypto - Cross-platform Cryptographic Library
 *
 * This file is auto-generated by cbindgen.
 * Do not edit manually.
 */
"""
include_guard = "ELECRYPTO_H"
pragma_once = true
autogen_warning = "/* Warning: This file is auto-generated. Do not edit. */"

[export]
prefix = "elecrypto_"

[fn]
prefix = "elecrypto_"
